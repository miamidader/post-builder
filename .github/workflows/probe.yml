name: Probe articles
# Temporary test: checks that the real article text can be read for today's stories.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs
      - name: Save report
        if: always()
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add data/probe.log
          git commit -m "Article probe report" || true
          git reset --hard -q
          git pull --rebase origin main
          git push
