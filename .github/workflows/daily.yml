name: Daily posts
# Every morning: collect today's stories, read the articles, and pre-write the headlines and article text (cheap text only, no photos). You pick which ones to turn into posts on the page.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: node scripts/build.mjs pick > build.log 2>&1; code=$?; cat build.log; exit $code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save results
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A today
          git diff --cached --quiet || git commit -m "Daily story picks"
          git reset --hard -q  # drop npm's changes to tracked files (node_modules, lockfile) so the pull can run
          git pull --rebase origin main
          git push
      - name: Save error log
        if: failure()
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          tail -c 6000 build.log > data/last-error.log
          git add data/last-error.log
          git commit -m "Daily build error log" || true
          git reset --hard -q  # drop npm's changes to tracked files (node_modules, lockfile) so the pull can run
          git pull --rebase origin main
          git push
