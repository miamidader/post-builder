name: Daily posts
# Every morning: collect today's stories, read the articles, and pre-write the headlines and article text (cheap text only, no photos). You pick which ones to turn into posts on the page.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '40 14 * * *' # backups: GitHub sometimes skips or delays a scheduled run, so these only do anything if today's list is still missing
    - cron: '20 16 * * *'
  workflow_dispatch:
    inputs:
      only_if_stale:
        description: 'Skip if today''s list already exists (the app sets this when it asks for a refresh)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: node scripts/build.mjs pick > build.log 2>&1; code=$?; cat build.log; exit $code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_IF_TODAY: ${{ (github.event_name == 'schedule' || inputs.only_if_stale) && '1' || '' }}
      - name: Auto-build the top 3 posts
        # Autopilot: no picking needed. Only runs when a fresh list has no posts yet. A failure here never blocks the list.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          IDS=$(node -e "const f=require('fs'),c=JSON.parse(f.readFileSync('today/candidates.json')),p=JSON.parse(f.readFileSync('today/posts.json'));console.log(p.posts.length?'':c.items.filter(x=>x.kind==='news'||x.kind==='sports').slice(0,3).map(x=>x.id).join(','))")
          if [ -n "$IDS" ]; then PICKS="$IDS" node scripts/build.mjs generate >> build.log 2>&1 || echo "Auto-build failed, the list is still saved."; tail -5 build.log; fi
      - name: Save results
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A today data/seen.json data/history.json
          git diff --cached --quiet || git commit -m "Daily story picks"
          git reset --hard -q  # drop npm's changes to tracked files (node_modules, lockfile) so the pull can run
          git pull --rebase origin main
          git push
      - name: Save error log
        if: failure()
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          tail -c 6000 build.log > data/last-error.log
          git add data/last-error.log
          git commit -m "Daily build error log" || true
          git reset --hard -q  # drop npm's changes to tracked files (node_modules, lockfile) so the pull can run
          git pull --rebase origin main
          git push
